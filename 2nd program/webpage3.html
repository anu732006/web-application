<!DOCTYPE html>
<html>
<head>
    <title>Study Timetable</title>

    <style>
        body {
            background-color: #f3e5f5;
            font-family: Arial;
        }

        h1 {
            color: #6a1b9a;
            text-align: center;
        }

        table {
            width: 700px;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #7b1fa2;
            color: white;
            padding: 15px;
        }

        td {
            color: #333333;
            padding: 12px;
            text-align: center;
            border: 1px solid #999999;
        }

        tr:nth-child(even) {
            background-color: #f1dff5;
        }
    </style>
</head>

<body>

    <h1>Student Study Timetable</h1>

    <table>

        <tr>
            <th>Day</th>
            <th>Subject</th>
            <th>Time</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Mathematics</td>
            <td>5:00 PM</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Computer Science</td>
            <td>5:00 PM</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Physics</td>
            <td>5:00 PM</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>English</td>
            <td>5:00 PM</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Programming</td>
            <td>5:00 PM</td>
        </tr>

    </table>

</body>
</html>
