<!DOCTYPE html>
<html>
<head>
    <title>College Library</title>

    <style>
        body {
            background-color: #fff8dc;
            font-family: "Times New Roman";
        }

        h1 {
            color: #8b4513;
            text-align: center;
            font-size: 38px;
        }

        h2 {
            color: #006400;
        }

        p {
            color: #333333;
            font-size: 19px;
        }

        .library {
            background-color: white;
            width: 600px;
            margin: 40px auto;
            padding: 30px;
            border: 4px solid #8b4513;
            border-radius: 15px;
        }

        .important {
            color: #cc0000;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="library">

        <h1>College Library</h1>

        <h2>Welcome to Our Library</h2>

        <p>
            Our library contains a large collection of
            <b>textbooks, reference books and journals</b>.
        </p>

        <h2>Library Facilities</h2>

        <p>• Digital Library</p>
        <p>• Reference Section</p>
        <p>• Newspaper Section</p>
        <p>• Internet Facility</p>

        <p class="important">
            Library Timing: 9:00 AM to 5:00 PM
        </p>

    </div>

</body>
</html>
