<!DOCTYPE html>
<html>
<head>
    <title>DOM Text Change</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #e6f2ff;
            padding: 50px;
        }

        h1 {
            color: navy;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 id="heading">Welcome to My Web Page</h1>

    <button onclick="changeText()">Click Me</button>

    <script>
        function changeText() {
            document.getElementById("heading").innerHTML =
                "Welcome to JavaScript DOM!";
        }
    </script>

</body>
</html>
